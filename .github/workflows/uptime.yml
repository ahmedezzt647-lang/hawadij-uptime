# مراقبة من برّا السيرفر: كل 10 دقايق يفحص البرنامجين. لو ما ردّوا 3 مرات ورا بعض يرسل 🔴 على تيليجرام، ولما يرجعون 🟢. مرة وحدة لكل تغيّر.
# الأسرار (Settings ← Secrets ← Actions): TELEGRAM_BOT_TOKEN و TELEGRAM_CHAT_ID. ما تنطبع في السجل.
name: uptime
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'أرسل رسالة تجربة على تيليجرام'
        type: boolean
        default: true
permissions:
  actions: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: check
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          TEST: ${{ inputs.test }}
        run: |
          send() { [ -n "$TG" ] && curl -s -m 15 -o /dev/null "https://api.telegram.org/bot$TG/sendMessage" --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$1"; }
          bad=""
          for u in https://hawadijcars.cloud/healthz https://fleet.hawadijcars.cloud/healthz; do
            ok=0
            for i in 1 2 3; do c=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$u"); [ "$c" = 200 ] && { ok=1; break; }; sleep 20; done
            [ $ok = 1 ] || bad+="• $u ($c)"$'\n'
          done
          prev=$(curl -s -H "Authorization: Bearer $GH" "https://api.github.com/repos/$REPO/actions/workflows/uptime.yml/runs?status=completed&per_page=5" \
            | jq -r --arg r "$RUN" '[.workflow_runs[] | select((.id|tostring) != $r)][0].conclusion // "success"')
          if [ -n "$bad" ]; then
            [ "$prev" = success ] && send "🔴 السيرفر ما يرد من برّا (فحص GitHub):"$'\n'"$bad"$'\n'"لو كله واقف، ادخل لوحة Hostinger وشيك على السيرفر."
            exit 1
          fi
          [ "$prev" = failure ] && send "🟢 السيرفر رجع يرد من برّا ✅"
          [ "$TEST" = true ] && send "✅ تجربة: مراقبة GitHub من برّا السيرفر شغّالة. البرنامجين يردّون، وبيوصلك تنبيه لو وقف السيرفر كله."
          echo ok
